# This is a sample GraphRAG settings.yaml file that allows users to run the GraphRAG index process with their customized parameters.
# The parameters in this file will only take effect when the USE_CUSTOMIZED_GRAPHRAG_SETTING is true in .env file.
# For a comprehensive understanding of GraphRAG parameters, please refer to: https://microsoft.github.io/graphrag/config/json_yaml/.

encoding_model: text-embedding-ada-002
skip_workflows: []
llm:
  api_key: ${OPENAI_API_KEY}
  type: openai_chat
  model: gpt-4o-mini
  model_supports_json: true
  request_timeout: 300.0
  max_retries: 8
  max_retry_wait: 120.0
  concurrent_requests: 1
  temperature: 0

parallelization:
  stagger: 4.0
  num_threads: 1
  # num_threads: 50 # the number of threads to use for parallel processing

async_mode: threaded # or asyncio

embeddings:
  ## parallelization: override the global parallelization settings for embeddings
  async_mode: threaded
  llm:
    type: openai_embedding
    model: text-embedding-ada-002
    api_key: ${OPENAI_API_KEY}
    request_timeout: 120.0
    max_retries: 8
    max_retry_wait: 120.0
    concurrent_requests: 1
    debug: true  # Enable debug output for embeddings
  vector_store:
    type: chroma
    collection_name: "documents"
    distance_metric: "l2"
    persist_directory: "ktem_app_data/user_data/vectorstore"
    debug_mode: true  # Enable vector store debugging
  batch_size: 4  # Increased batch size for smaller chunks
  batch_max_tokens: 4096  # Adjusted for smaller chunk processing
  concurrent_requests: 1
  sleep_on_rate_limit_recommendation: true
  max_rate_limit_retries: 8

chunks:
  size: 600  # Balanced size for semantic coherence while keeping context manageable
  overlap: 100  # ~20% overlap to maintain context between chunks
  group_by_columns: [id]
  debug_output: true  # Enable debug output for chunking

input:
  type: file # or blob
  file_type: text # or csv
  base_dir: "input"
  file_encoding: utf-8
  file_pattern: ".*\\.txt$"

cache:
  type: file # or blob
  base_dir: "cache"
  # connection_string: <azure_blob_storage_connection_string>
  # container_name: <azure_blob_storage_container_name>

storage:
  type: file # or blob
  base_dir: "output"
  # connection_string: <azure_blob_storage_connection_string>
  # container_name: <azure_blob_storage_container_name>

reporting:
  type: file # or console, blob
  base_dir: "output"
  debug_level: "DEBUG"  # Set debug level for reporting
  log_format: "detailed"  # Use detailed logging format
  # connection_string: <azure_blob_storage_connection_string>
  # container_name: <azure_blob_storage_container_name>

entity_extraction:
  ## strategy: fully override the entity extraction strategy.
  ##   type: one of graph_intelligence, graph_intelligence_json and nltk
  ## llm: override the global llm settings for this task
  ## parallelization: override the global parallelization settings for this task
  ## async_mode: override the global async_mode settings for this task
  llm:
    request_timeout: 180.0
    max_retries: 5
    max_retry_wait: 180.0
    concurrent_requests: 1
  prompt: "prompts/entity_extraction.txt"
  entity_types: [disease, treatment, drug, biomarker, clinical_trial, patient_outcome, side_effect, medical_procedure]
  max_gleanings: 1

summarize_descriptions:
  ## llm: override the global llm settings for this task
  ## parallelization: override the global parallelization settings for this task
  ## async_mode: override the global async_mode settings for this task
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

claim_extraction:
  ## llm: override the global llm settings for this task
  ## parallelization: override the global parallelization settings for this task
  ## async_mode: override the global async_mode settings for this task
  llm:
    request_timeout: 90.0
    max_retries: 3
    max_retry_wait: 90.0
    concurrent_requests: 3
  enabled: true
  prompt: "prompts/claim_extraction.txt"
  description: "Extract key oncological claims, findings, and clinical insights that could be relevant to cancer research and treatment."
  max_gleanings: 1

community_reports:
  ## llm: override the global llm settings for this task
  ## parallelization: override the global parallelization settings for this task
  ## async_mode: override the global async_mode settings for this task
  llm:
    request_timeout: 60.0
    max_retries: 3
    max_retry_wait: 60.0
    concurrent_requests: 1
  prompt: "prompts/community_report.txt"
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 10

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes
  # num_walks: 10
  # walk_length: 40
  # window_size: 2
  # iterations: 3
  # random_seed: 597832

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes

snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false

local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 5
  top_k_mapped_entities: 10
  top_k_relationships: 10
  llm_temperature: 0 # temperature for sampling
  llm_top_p: 1 # top-p sampling
  llm_n: 1 # Number of completions to generate
  max_tokens: 32000

global_search:
  llm_temperature: 0 # temperature for sampling
  llm_top_p: 1 # top-p sampling
  llm_n: 1 # Number of completions to generate
  max_tokens: 3000
  data_max_tokens: 12000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 32
