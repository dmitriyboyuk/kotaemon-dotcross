<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2b2b2b"/>
  
  <!-- Ox head -->
  <path d="M50 20
           C30 20, 15 35, 15 50
           C15 65, 30 80, 50 80
           C70 80, 85 65, 85 50
           C85 35, 70 20, 50 20Z" fill="#ffffff"/>
  
  <!-- Left horn -->
  <path d="M25 45
           C20 40, 15 30, 20 25
           C25 20, 35 25, 35 35Z" fill="#ffffff"/>
  
  <!-- Right horn -->
  <path d="M75 45
           C80 40, 85 30, 80 25
           C75 20, 65 25, 65 35Z" fill="#ffffff"/>
  
  <!-- Left eye -->
  <circle cx="35" cy="45" r="3" fill="#000000"/>
  
  <!-- Right eye -->
  <circle cx="65" cy="45" r="3" fill="#000000"/>
</svg>